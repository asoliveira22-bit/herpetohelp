name: Initialize HerpetoHelp source tree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    if: ${{ hashFiles('herpetohelp-1.0.0.tar.gz') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand validated source package
        shell: bash
        run: |
          tar -xzf herpetohelp-1.0.0.tar.gz --strip-components=1
          rm -f herpetohelp-1.0.0.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release HerpetoHelp v1.0.0"
          git push
